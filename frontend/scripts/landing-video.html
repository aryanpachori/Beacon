<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Beacon landing video</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1280px; height: 800px; overflow: hidden; background: #141a24; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="c" width="1280" height="800"></canvas>
  <script>
    const W = 1280, H = 800
    const canvas = document.getElementById('c')
    const ctx = canvas.getContext('2d')

    const LOOP_MS = 12000
    let start = performance.now()

    const C = {
      sky0: '#111723',
      sky1: '#243248',
      sky2: '#3f5669',
      haze: 'rgba(196,176,146,0.22)',
      sea0: '#182a3a',
      sea1: '#2a465f',
      sea2: '#355d75',
      globeSea: '#365f77',
      globeSeaDark: '#223e53',
      globeLand: '#5B6E4C',
      globeLandDark: '#40502F',
      rim: 'rgba(233,223,202,0.18)',
      ivory: '#F6F1E6',
      sand: '#D6C6AA',
      tower: '#ECE1CC',
      beamCore: 'rgba(255,240,198,0.62)',
      beamOuter: 'rgba(255,221,154,0.26)',
      wake: 'rgba(232,228,214,0.25)',
      mist: 'rgba(240,230,214,0.1)',
    }

    const STARS = Array.from({ length: 120 }, (_, i) => ({
      x: (Math.sin(i * 91.73) * 0.5 + 0.5) * W,
      y: (Math.cos(i * 37.17) * 0.5 + 0.5) * H * 0.62,
      r: 0.5 + (i % 4) * 0.35,
      phase: (i * 0.63) % (Math.PI * 2),
    }))

    const SHIPS = [
      { t: 0.08, speed: 0.024, size: 0.95 },
      { t: 0.36, speed: 0.018, size: 0.82 },
      { t: 0.63, speed: 0.021, size: 0.72 },
    ]

    function circle(x, y, r) {
      ctx.beginPath()
      ctx.arc(x, y, r, 0, Math.PI * 2)
    }

    function softRectGradient() {
      const g = ctx.createLinearGradient(0, 0, 0, H)
      g.addColorStop(0, C.sky0)
      g.addColorStop(0.42, C.sky1)
      g.addColorStop(0.72, C.sky2)
      g.addColorStop(1, C.sea1)
      ctx.fillStyle = g
      ctx.fillRect(0, 0, W, H)
    }

    function drawAtmosphere(t) {
      softRectGradient()

      STARS.forEach((s) => {
        const a = 0.2 + 0.45 * (0.5 + 0.5 * Math.sin(t / 1300 + s.phase))
        circle(s.x, s.y, s.r)
        ctx.fillStyle = `rgba(246,241,230,${a})`
        ctx.fill()
      })

      const warm = ctx.createRadialGradient(W * 0.72, H * 0.55, 0, W * 0.72, H * 0.55, 420)
      warm.addColorStop(0, C.haze)
      warm.addColorStop(1, 'transparent')
      ctx.fillStyle = warm
      ctx.fillRect(0, 0, W, H)
    }

    function drawSea(t) {
      const horizon = H * 0.71
      const g = ctx.createLinearGradient(0, horizon, 0, H)
      g.addColorStop(0, C.sea2)
      g.addColorStop(0.5, C.sea1)
      g.addColorStop(1, C.sea0)
      ctx.fillStyle = g
      ctx.fillRect(0, horizon, W, H - horizon)

      for (let layer = 0; layer < 5; layer++) {
        const y0 = horizon + 15 + layer * 20
        const amp = 4 - layer * 0.5
        const speed = 0.00075 + layer * 0.00016
        ctx.beginPath()
        ctx.moveTo(0, y0)
        for (let x = 0; x <= W; x += 8) {
          const y = y0 + Math.sin(x * 0.012 + t * speed + layer * 0.9) * amp
          ctx.lineTo(x, y)
        }
        ctx.lineTo(W, H)
        ctx.lineTo(0, H)
        ctx.closePath()
        ctx.fillStyle = `rgba(15,30,44,${0.07 + layer * 0.035})`
        ctx.fill()
      }
    }

    function drawGlobe(cx, cy, r, spin) {
      const aura = ctx.createRadialGradient(cx, cy, r * 0.6, cx, cy, r * 1.35)
      aura.addColorStop(0, 'rgba(163,188,140,0.12)')
      aura.addColorStop(1, 'transparent')
      circle(cx, cy, r * 1.35)
      ctx.fillStyle = aura
      ctx.fill()

      const sphere = ctx.createRadialGradient(cx - r * 0.25, cy - r * 0.3, r * 0.1, cx, cy, r)
      sphere.addColorStop(0, '#4f7890')
      sphere.addColorStop(0.5, C.globeSea)
      sphere.addColorStop(1, C.globeSeaDark)
      circle(cx, cy, r)
      ctx.fillStyle = sphere
      ctx.fill()

      ctx.save()
      circle(cx, cy, r)
      ctx.clip()

      for (let i = -3; i <= 3; i++) {
        const latY = cy + i * r * 0.17
        ctx.beginPath()
        ctx.ellipse(cx, latY, r * (1 - Math.abs(i) * 0.08), r * 0.09, 0, 0, Math.PI * 2)
        ctx.strokeStyle = 'rgba(238,231,215,0.07)'
        ctx.lineWidth = 1
        ctx.stroke()
      }

      const landMasses = [
        [[-0.56, -0.12], [-0.2, -0.32], [0.05, -0.14], [-0.08, 0.16], [-0.42, 0.24]],
        [[0.16, 0.08], [0.42, -0.12], [0.62, 0.09], [0.48, 0.35], [0.2, 0.28]],
        [[-0.78, 0.05], [-0.64, -0.16], [-0.52, 0.14], [-0.66, 0.26]],
      ]
      landMasses.forEach((poly, idx) => {
        ctx.beginPath()
        poly.forEach(([px, py], i) => {
          const a = Math.atan2(py, px) + spin
          const d = Math.sqrt(px * px + py * py) * r * 0.96
          const x = cx + Math.cos(a) * d
          const y = cy + Math.sin(a) * d * 0.58
          if (i === 0) ctx.moveTo(x, y)
          else ctx.lineTo(x, y)
        })
        ctx.closePath()
        ctx.fillStyle = idx === 1 ? C.globeLandDark : C.globeLand
        ctx.globalAlpha = 0.86
        ctx.fill()
      })
      ctx.globalAlpha = 1

      const shade = ctx.createLinearGradient(cx - r, cy, cx + r, cy)
      shade.addColorStop(0, 'rgba(5,12,20,0.62)')
      shade.addColorStop(0.48, 'rgba(5,12,20,0.08)')
      shade.addColorStop(1, 'rgba(5,12,20,0.34)')
      ctx.fillStyle = shade
      ctx.fillRect(cx - r, cy - r, r * 2, r * 2)
      ctx.restore()

      circle(cx, cy, r)
      ctx.strokeStyle = C.rim
      ctx.lineWidth = 2
      ctx.stroke()
    }

    function drawLighthouse(x, y, beamAngle, t) {
      const towerH = 126
      const towerW = 23
      const baseY = y
      const topY = y - towerH

      ctx.beginPath()
      ctx.moveTo(x - 62, baseY + 11)
      ctx.quadraticCurveTo(x - 22, baseY - 32, x + 16, baseY - 8)
      ctx.quadraticCurveTo(x + 42, baseY + 4, x + 58, baseY + 13)
      ctx.closePath()
      ctx.fillStyle = '#2b2f37'
      ctx.fill()

      ctx.fillStyle = C.tower
      ctx.fillRect(x - towerW / 2, topY, towerW, towerH)
      ctx.fillStyle = C.globeLand
      ctx.fillRect(x - towerW / 2, topY + 28, towerW, 14)
      ctx.fillRect(x - towerW / 2, topY + 70, towerW, 12)

      ctx.fillStyle = '#1f232a'
      ctx.fillRect(x - 16, topY - 18, 32, 16)
      ctx.fillStyle = C.ivory
      ctx.fillRect(x - 10, topY - 15, 20, 10)

      const pulse = 0.9 + 0.12 * Math.sin(t * 0.01)
      const lanternGlow = ctx.createRadialGradient(x, topY - 10, 0, x, topY - 10, 52 * pulse)
      lanternGlow.addColorStop(0, 'rgba(255,241,208,0.95)')
      lanternGlow.addColorStop(0.45, 'rgba(255,223,164,0.45)')
      lanternGlow.addColorStop(1, 'transparent')
      circle(x, topY - 10, 52 * pulse)
      ctx.fillStyle = lanternGlow
      ctx.fill()

      ctx.save()
      ctx.translate(x, topY - 10)
      ctx.rotate(beamAngle)
      const beamLen = 500
      const beamSpread = 0.26
      const beamGradient = ctx.createRadialGradient(0, 0, 0, beamLen * 0.4, 0, beamLen)
      beamGradient.addColorStop(0, C.beamCore)
      beamGradient.addColorStop(0.52, C.beamOuter)
      beamGradient.addColorStop(1, 'transparent')
      ctx.beginPath()
      ctx.moveTo(0, 0)
      ctx.arc(0, 0, beamLen, -beamSpread, beamSpread)
      ctx.closePath()
      ctx.fillStyle = beamGradient
      ctx.fill()
      ctx.restore()
    }

    function drawShip(x, y, angle, scale, lit, t) {
      ctx.save()
      ctx.translate(x, y)
      ctx.rotate(angle)
      ctx.scale(scale, scale)

      ctx.beginPath()
      ctx.moveTo(-20, 2)
      ctx.quadraticCurveTo(-36 - Math.sin(t * 0.012) * 3, 6, -52, 11)
      ctx.strokeStyle = lit ? 'rgba(255,232,184,0.3)' : C.wake
      ctx.lineWidth = 1.8
      ctx.stroke()

      ctx.beginPath()
      ctx.moveTo(-13, 0)
      ctx.lineTo(12, 0)
      ctx.lineTo(9, 7)
      ctx.lineTo(-9, 7)
      ctx.closePath()
      ctx.fillStyle = lit ? '#4b5c4a' : '#303845'
      ctx.fill()

      ctx.beginPath()
      ctx.moveTo(-1, -1)
      ctx.lineTo(-1, -19)
      ctx.lineTo(11, -6)
      ctx.closePath()
      ctx.fillStyle = lit ? C.ivory : '#d2c6b2'
      ctx.fill()

      ctx.restore()
    }

    function inBeam(px, py, bx, by, angle, spread) {
      const dx = px - bx
      const dy = py - by
      const dist = Math.sqrt(dx * dx + dy * dy)
      if (dist > 500) return false
      let a = Math.atan2(dy, dx)
      let d = a - angle
      while (d > Math.PI) d -= Math.PI * 2
      while (d < -Math.PI) d += Math.PI * 2
      return Math.abs(d) < spread
    }

    function drawMist(t) {
      for (let i = 0; i < 4; i++) {
        const x = ((t * (0.012 + i * 0.004)) + i * 320) % (W + 320) - 160
        const y = H * 0.65 + i * 24
        const g = ctx.createRadialGradient(x, y, 0, x, y, 180)
        g.addColorStop(0, C.mist)
        g.addColorStop(1, 'transparent')
        ctx.fillStyle = g
        ctx.fillRect(x - 180, y - 90, 360, 180)
      }
    }

    function frame(now) {
      const t = now - start
      const loop = (t % LOOP_MS) / LOOP_MS
      const globeSpin = loop * Math.PI * 2
      const beamAngle = -Math.PI / 2.2 + loop * Math.PI * 2
      const camDriftX = Math.sin(t * 0.00022) * 14
      const camDriftY = Math.cos(t * 0.00018) * 8

      drawAtmosphere(t)
      drawSea(t)
      drawMist(t)

      const gx = W * 0.67 + camDriftX
      const gy = H * 0.5 + camDriftY
      const gr = 210
      drawGlobe(gx, gy, gr, globeSpin)

      const lighthouseX = gx + gr * 0.08
      const lighthouseBaseY = gy - gr * 0.58
      drawLighthouse(lighthouseX, lighthouseBaseY, beamAngle, t)

      SHIPS.forEach((ship) => {
        const a = (ship.t + loop * ship.speed * 3.4) * Math.PI * 2
        const sx = gx + Math.cos(a) * gr * 1.22
        const sy = gy + Math.sin(a) * gr * 0.49 + 112
        const lit = inBeam(sx, sy, lighthouseX, lighthouseBaseY - 136, beamAngle, 0.3)
        drawShip(sx, sy, a + Math.PI / 2, 2.08 * ship.size, lit, t)
      })

      const vignette = ctx.createRadialGradient(W * 0.58, H * 0.48, H * 0.22, W * 0.58, H * 0.48, H * 0.92)
      vignette.addColorStop(0, 'transparent')
      vignette.addColorStop(1, 'rgba(8,12,18,0.42)')
      ctx.fillStyle = vignette
      ctx.fillRect(0, 0, W, H)

      requestAnimationFrame(frame)
    }

    requestAnimationFrame(frame)
    window.__READY__ = true
  </script>
</body>
</html>
