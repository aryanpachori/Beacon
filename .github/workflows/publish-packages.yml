name: Publish npm packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'packages-v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build packages
        run: npm run build:packages

      - name: Publish engine, mcp, cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish -w @forgefastlabs/beacon-engine --access public
          npm publish -w @forgefastlabs/beacon-mcp --access public
          npm publish -w @forgefastlabs/beacon-cli --access public
