services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
    volumes:
      - ./driftlogg.2026-06-10.private-key.pem:/app/driftlogg.2026-06-10.private-key.pem:ro
    environment:
      GITHUB_APP_PRIVATE_KEY_PATH: /app/driftlogg.2026-06-10.private-key.pem
